services:
  db:
    image: postgres:16-alpine
    container_name: cp-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-CollegePortal}
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: CollegePortal.Api/Dockerfile
    container_name: cp-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TZ: Europe/Moscow
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-CollegePortal};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      Admin__Email: ${ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD}
      Admin__DisplayName: ${ADMIN_DISPLAYNAME:-Administrator}
      PrimaryAdmin__Secret: ${PRIMARY_ADMIN_SECRET:-}
      PrimaryAdmin__SecretHash: ${PRIMARY_ADMIN_SECRET_HASH:-}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:-http://localhost:8080}
      DataProtection__KeysPath: /keys
      Database__AutoMigrate: "true"
    volumes:
      - dpkeys:/keys
    depends_on:
      - db
    restart: unless-stopped

  web:
    build:
      context: ./college-portal-client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: cp-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  # Optional profile: automatic HTTPS + custom domain.
  # Start with:  docker compose --profile tls up -d
  caddy:
    image: caddy:2-alpine
    container_name: cp-caddy
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?set CADDY_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  dpkeys:
  caddy-data:
  caddy-config:
