services:
  db:
    image: postgres:16-alpine
    container_name: cp-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-CollegePortal}
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: CollegePortal.Api/Dockerfile
    container_name: cp-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TZ: Europe/Moscow
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-CollegePortal};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      Admin__Email: ${ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD}
      Admin__DisplayName: ${ADMIN_DISPLAYNAME:-Administrator}
      PrimaryAdmin__Secret: ${PRIMARY_ADMIN_SECRET:-}
      PrimaryAdmin__SecretHash: ${PRIMARY_ADMIN_SECRET_HASH:-}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:-http://localhost:8080}
      Client__BaseUrl: ${PUBLIC_ORIGIN:-http://localhost:8080}
      Auth__OtpPepper: ${AUTH_OTP_PEPPER:-}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      OAuth__RedirectBaseUrl: ${OAUTH_REDIRECT_BASE_URL:-}
      OAuth__Google__ClientId: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAuth__Google__ClientSecret: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAuth__GitHub__ClientId: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAuth__GitHub__ClientSecret: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAuth__Yandex__ClientId: ${OAUTH_YANDEX_CLIENT_ID:-}
      OAuth__Yandex__ClientSecret: ${OAUTH_YANDEX_CLIENT_SECRET:-}
      OAuth__Vk__ClientId: ${OAUTH_VK_CLIENT_ID:-}
      OAuth__Vk__ClientSecret: ${OAUTH_VK_CLIENT_SECRET:-}
      PushServiceClient__PublicKey: ${PUSH_VAPID_PUBLIC_KEY:-}
      PushServiceClient__PrivateKey: ${PUSH_VAPID_PRIVATE_KEY:-}
      PushServiceClient__Subject: ${PUSH_VAPID_SUBJECT:-mailto:admin@example.com}
      DataProtection__KeysPath: /keys
      Chat__FilesRoot: /data/chat-files
      Database__AutoMigrate: "true"
    volumes:
      - chatfiles:/data/chat-files
      - dpkeys:/keys
    depends_on:
      - db
    restart: unless-stopped

  web:
    build:
      context: ./college-portal-client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: cp-web
    # Host-published port is bound to localhost only. Reached externally via
    # caddy over the internal Docker network. Docker-published ports bypass
    # ufw/firewalld, so never publish 0.0.0.0:8080 on a public server.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  # Optional TLS front door: automatic Let's Encrypt certificates.
  # Enable with: docker compose --profile tls up -d --build
  # Requires CADDY_DOMAIN in .env, a DNS A/AAAA record pointing here, and
  # ports 80/443 open. Talks to the web container over the internal network.
  caddy:
    image: caddy:2-alpine
    container_name: cp-caddy
    profiles: ["tls"]
    depends_on:
      - web
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # Optional: publish the site without opening any ports (works behind CGNAT).
  # Enable with: docker compose --profile tunnel up -d --build
  # Requires CLOUDFLARE_TUNNEL_TOKEN in .env (Zero Trust -> Networks -> Tunnels).
  # In the tunnel's Public Hostname set the Service URL to http://web:80
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cp-tunnel
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  chatfiles:
  dpkeys:
  caddy_data:
  caddy_config:
